version: "1.0.0"
title: "builder-II governed read-only session"
description: >
  Governed interposition recipe (G2). Goose's only tool surface is the builder-II governed
  MCP server; there are no developer/shell builtins. Every tool call is mediated by
  `builder-mcp serve`, which runs the governed envelope -> receipt -> ledger ceremony and
  exposes inventory-admitted passive/read services, including exact patch proposal evidence.
  This recipe grants no approval or execution authority and enables no shell, target source
  mutation, patch application, or generic write.
instructions: |
  All tool calls are mediated by the builder-II governed MCP server (extension
  "builder_ii_governed"). Read services and passive patch proposal planning are available.
  patch_proposal may persist only Builder-II control-plane evidence beneath the canonical
  governed artifact namespace and must stop at HUMAN_APPROVAL_REQUIRED. There is no shell,
  source-file editing, patch application, approval minting, rollback, or Git mutation. Every
  call is recorded as a governed receipt and a hash-chained event; nothing here grants
  execution or promotion authority.

  If a task requires applying a proposal, writing target source, running shell, or otherwise
  mutating the target, stop and report that it is out of scope -- do not attempt to work around
  the absence of those tools. Creating passive governed proposal evidence is allowed.
prompt: |
  Governed read-only session ready. Only the builder-II governed MCP tools are available.
settings:
  temperature: 0.0
  goose_mode: auto
extensions:
  - type: stdio
    name: builder_ii_governed
    cmd: builder-mcp
    args:
      - serve
    timeout: 300
    description: "builder-II governed MCP server (passive/read services; ledgered)"
