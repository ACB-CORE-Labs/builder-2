# NOTE: Branch protection is an external repository-level setting managed on the
# hosting server. It is NOT a code-level guarantee and cannot be fully enforced by
# this file. Administrators must manually configure branch protection settings.
#
# This workflow provisions an environment and then delegates every BLOCKING gate to
# `scripts/ci.sh`, which is the single source of truth for the gate battery. Do not
# add a gate here -- add it to `scripts/ci.sh`, so that a developer running the
# battery locally runs exactly what CI runs. `tests/test_ci_gate_parity.py` pins this.
#
# The one workflow-only step is gitleaks: it is an Action, needs a token, and is
# `continue-on-error: true` -- advisory, never blocking, so it cannot change whether
# the battery is green.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  high-assurance-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync Python environment
        run: uv sync --all-groups

      - name: Run Gitleaks scan (advisory, non-blocking)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true # Keep as warning/information unless explicitly blocked by repo admin

      - name: Blocking gate battery
        run: bash scripts/ci.sh
