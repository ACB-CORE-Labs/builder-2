# NOTE: Branch protection is an external repository-level setting managed on the
# hosting server. It is NOT a code-level guarantee and cannot be fully enforced by
# this file. Administrators must manually configure branch protection settings.
#
# This workflow provisions an environment and then delegates every BLOCKING gate to
# `scripts/ci.sh`, which is the single source of truth for the gate battery. Do not
# add a gate here -- add it to `scripts/ci.sh`, so that a developer running the
# battery locally runs exactly what CI runs. `tests/test_ci_gate_parity.py` pins this.
#
# Everything below the checkout is PROVISIONING and caching. It exists to make the
# environment cheap to assemble; it must never decide what is checked. Every gate runs
# on every commit.
#
# Action references use GitHub's native `owner/repository@ref` grammar. A prior Forgejo-era
# version used full `https://github.com/...` action URLs; GitHub Actions rejects that spelling
# while preparing the job, before checkout or any repository gate can run. The canonical GitHub
# workflow must be valid on the host that is evaluating this PR. Mirrors that need a different
# artifact backend are a hosting-adapter concern, never a reason for canonical CI to fail before
# it can examine the commit.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  high-assurance-gates:
    runs-on: ubuntu-latest
    env:
      # Non-Apple default for CI; mlx is optional extra only.
      BUILDER_MODEL_BACKEND: ollama
    steps:
      # Shallow on purpose. No gate reads git history -- the gate-battery receipt records only
      # HEAD and the working-tree state -- so a full-history clone would pay for data no gate uses.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable

      # Provisioning dominates a cold hosted run, so caches may be re-enabled when the hosting
      # backend is reliable. They may change only how cheaply the environment is assembled; the
      # gate set remains unconditionally defined by scripts/ci.sh.
      #
      # Cache action remains disabled at this baseline because the prior Forgejo runner had cache
      # timeout issues. The commented reference stays documentation only; no cache result may ever
      # decide whether a gate runs (pinned by tests/test_ci_gate_parity.py).
      # - name: Cache cargo registry + the Rust validator build
      #   uses: actions/cache@v3
      #   with:
      #     path: |
      #       ~/.cargo/registry
      #       ~/.cargo/git
      #       builder_ii_validation_rs/target
      #     key: cargo-${{ runner.os }}-${{ hashFiles('builder_ii_validation_rs/Cargo.lock') }}
      #     restore-keys: |
      #       cargo-${{ runner.os }}-

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      # Deliberately no actions/setup-python: uv provisions the interpreter pinned in
      # .python-version, matching local project resolution and avoiding a second Python selector.
      - name: Install pinned Python (.python-version, via uv)
        run: uv python install

      - name: Sync Python environment
        run: uv sync --all-groups

      # The receipt path sits under .builder/ (gitignored) deliberately, and
      # tests/test_ci_gate_parity.py pins it: `git status --porcelain` sees an untracked
      # receipt left by a PREVIOUS run, so a repo-root path would make the very next run
      # report `working_tree_clean: false`. Exit-code discipline: scripts/ci.sh exits 3
      # when a requested receipt cannot be written on an otherwise-green battery; no
      # continue-on-error exists here, so any non-zero code fails the job.
      - name: Blocking gate battery
        run: bash scripts/ci.sh --receipt .builder/artifacts/gate-battery-receipt.json

      # The receipt that matters most is the one from a RED run. `if: always()` makes the upload
      # execute even when the battery fails. GitHub-hosted Actions uses upload-artifact v4; the
      # receipt remains RECORDED_ONLY evidence of the run, not independent proof of correctness.
      - name: Upload gate battery receipt (even when the battery is red)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-battery-receipt
          path: .builder/artifacts/gate-battery-receipt.json
