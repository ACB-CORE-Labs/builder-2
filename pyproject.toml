[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "builder-ii"
version = "0.1.0"
description = "Generic governed local agent/developer platform with Goose and MLX support"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "mlx-lm>=0.31.3",
    "psutil>=7.2.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0",
    "rapid-mlx>=0.8.12",
    "rich>=15.0.0",
    "typer>=0.25.1",
]

[project.scripts]
builder = "builder_ii.cli:app"
builder-runtime = "builder_ii.runtime_control:runtime_app"
builder-lanes = "builder_ii.lane_guides:lane_app"
builder-tools = "builder_ii.tools_cli:tools_app"
builder-context = "builder_ii.context_cli:context_app"
builder-targets = "builder_ii.targets_cli:targets_app"
builder-agent = "builder_ii.agent_cli:agent_app"
builder-bridge = "builder_ii.bridge_cli:bridge_app"
builder-bundle = "builder_ii.bundle_cli:bundle_app"
builder-goose = "builder_ii.goose_cli:goose_app"
builder-records = "builder_ii.approval_records_cli:approval_app"
builder-preflight = "builder_ii.preflight_cli:preflight_app"
builder-receipt = "builder_ii.receipt_records_cli:receipt_app"
builder-chain = "builder_ii.chain_summary_cli:chain_app"
builder-handoff = "builder_ii.handoff_bundle_cli:handoff_app"
builder-intake = "builder_ii.intake_cli:intake_app"
builder-index = "builder_ii.artifact_index_cli:index_app"
builder-promotion = "builder_ii.promotion_readiness_cli:promotion_app"
builder-promotion-decision = "builder_ii.promotion_decision_cli:promotion_decision_app"
builder-state-index = "builder_ii.state_index_cli:state_index_app"
builder-deepagents = "builder_ii.deepagents_cli:deepagents_app"
builder-notes = "builder_ii.notes_cli:notes_app"
builder-quality = "builder_ii.quality_cli:quality_app"
builder-research = "builder_ii.research_cli:research_app"
builder-verification = "builder_ii.verification_cli:verification_app"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["builder_ii*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
